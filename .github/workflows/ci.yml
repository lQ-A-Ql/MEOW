name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  docs:
    name: Docs Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate engineering docs
        run: bash scripts/check-docs.sh

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xz-utils rpm2cpio cpio zstd gzip tar

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1

      - name: Unit tests
        run: go test ./... -count=1

      - name: Coverage profile
        run: go test ./... -count=1 -coverprofile=coverage.out

      - name: Coverage baseline
        run: bash scripts/check-coverage.sh coverage.out

      - name: Race tests
        run: go test -race ./cmd ./internal/...

      - name: Build meow
        run: go build -o meow .

      - name: Smoke parse (no remote)
        run: ./meow --json parse --banner-file ./testdata/banners/ubuntu_5.4.0_163.txt --no-remote-symbols

      - name: Smoke build dry-run Ubuntu (no remote)
        run: ./meow --json build --dry-run --banner-file ./testdata/banners/ubuntu_5.4.0_163.txt --no-remote-symbols

      - name: Smoke build dry-run RPM-family (no remote)
        run: ./meow --json build --dry-run --banner-file ./testdata/banners/centos_4.18.0_513.txt --no-remote-symbols

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out
          if-no-files-found: warn
